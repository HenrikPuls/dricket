# golangci-lint v2 configuration. Pinned in .github/workflows/ci.yml.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - errorlint
    - misspell
    - revive
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
