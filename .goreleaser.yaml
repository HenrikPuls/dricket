# GoReleaser v2 configuration.
# The entry point is ./cmd/dk; the program ships under the single name
# `dk` (see AGENTS.md and the README install section).
version: 2
project_name: dricket

before:
  hooks:
    - go mod tidy

builds:
  - id: dk
    main: ./cmd/dk
    binary: dk
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version=v{{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    ids: [dk]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  prerelease: auto

# Optional, enable once you have decided on signing:
# signs:
#   - cmd: cosign
#     artifacts: checksum
